<template>
    <div class={cardClass}>

        <template lwc:if={isRefreshing}>
            <lightning-spinner size="small" alternative-text="Refreshing chart"></lightning-spinner>
        </template>

        <div class="trend-header">
            <template lwc:if={showTitle}>
                <span class="trend-title">{titlePrefix}<span class="wmf-name-gradient">{titleName}</span></span>
            </template>
            <div class="trend-legend">
                <template for:each={legend} for:item="item">
                    <span key={item.key} class="legend-item">
                        <span class="legend-dot" style={item.style}></span>
                        <span class="legend-label">{item.label}</span>
                    </span>
                </template>
                <lightning-button-icon class="trend-refresh"
                    icon-name="utility:refresh" variant="border-filled" size="x-small"
                    alternative-text="Refresh" title="Refresh"
                    onclick={handleRefresh}>
                </lightning-button-icon>
            </div>
        </div>

        <template lwc:if={hasError}>
            <div class="trend-state">
                <lightning-icon icon-name="utility:error" size="small" variant="error"
                    alternative-text="Error"></lightning-icon>
                <p class="state-text">{error}</p>
            </div>
        </template>

        <template lwc:elseif={hasData}>
            <svg class="trend-chart" viewBox={viewBox} preserveAspectRatio="xMidYMid meet"
                role="img" aria-label="Stacked bar chart of daily macro distribution">

                <!-- gridlines + y labels -->
                <template for:each={gridLines} for:item="g">
                    <g key={g.key}>
                        <line class="grid-line" x1={g.x1} y1={g.y} x2={g.x2} y2={g.y}></line>
                        <text class="axis-label" x={g.labelX} y={g.labelY} text-anchor="end">{g.label}</text>
                    </g>
                </template>

                <!-- stacked bars -->
                <template for:each={bars} for:item="bar">
                    <g key={bar.key}>
                        <!-- segment rects — grow up from the baseline on load -->
                        <g class="bar-bars">
                            <template for:each={bar.segments} for:item="seg">
                                <rect key={seg.key} x={seg.x} y={seg.y} width={seg.width}
                                    height={seg.height} fill={seg.fill}>
                                    <title>{seg.title}</title>
                                </rect>
                            </template>
                        </g>
                        <!-- segment labels — fade in after the bars have grown -->
                        <g class="bar-labels">
                            <template for:each={bar.segments} for:item="seg">
                                <g key={seg.key}>
                                    <template lwc:if={seg.showLabel}>
                                        <text class="seg-label" x={seg.labelX} y={seg.labelY}
                                            text-anchor="middle">{seg.pct}%</text>
                                    </template>
                                    <template lwc:if={seg.showGrams}>
                                        <text class="seg-grams" x={seg.labelX} y={seg.gramsY}
                                            text-anchor="middle">{seg.gramsLabel}</text>
                                    </template>
                                </g>
                            </template>
                        </g>

                        <!-- x-axis day label + meal count -->
                        <text class="axis-label day-label" x={bar.xLabelX} y={bar.xLabelY}
                            text-anchor="middle">{bar.xLabel}</text>
                        <text class="meal-count" x={bar.xLabelX} y={bar.mealLabelY}
                            text-anchor="middle">{bar.mealLabel}</text>
                    </g>
                </template>
            </svg>
        </template>

        <template lwc:else>
            <div class="trend-state">
                <lightning-icon icon-name="utility:chart" size="small"
                    alternative-text="No data"></lightning-icon>
                <p class="state-text">No analyzed meals in this period yet.</p>
            </div>
        </template>

    </div>
</template>
